name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    defaults:
      run:
        working-directory: packages/scoutline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/scoutline/package-lock.json
      - run: npm ci
      - run: npm run build
      # Publish gate = offline suite (tests import dist/; build ran above)
      - run: node scripts/run-tests.mjs offline

  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/scoutline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/scoutline/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx tsc --noEmit

  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/scoutline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/scoutline/package-lock.json
      - run: npm ci
      - run: npm run build
      # Compiled dispatcher must boot (AGENTS.md smoke convention)
      - run: node bin/scoutline.js --help
